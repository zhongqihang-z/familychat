<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>家庭聊天</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #e8f5ee; }
  button { font-family: inherit; border: none; cursor: pointer; }

  /* ---------- 登录页 ---------- */
  #login {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; background: #1faa59; color: #fff; padding: 24px;
  }
  #login h1 { font-size: 40px; margin-bottom: 8px; letter-spacing: 4px; }
  #login p { font-size: 15px; opacity: .85; margin-bottom: 40px; }
  #nameInput {
    width: 100%; max-width: 320px; height: 56px; border-radius: 12px; border: none;
    font-size: 20px; padding: 0 18px; text-align: center; outline: none; margin-bottom: 16px;
  }
  #joinBtn {
    width: 100%; max-width: 320px; height: 56px; border-radius: 12px;
    background: #fff; color: #1faa59; font-size: 22px; font-weight: 700;
  }

  /* ---------- 主界面 ---------- */
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #topbar {
    background: #1faa59; color: #fff; padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
  }
  #topbar .title { font-size: 21px; font-weight: 700; }
  #topbar .sub { font-size: 13px; opacity: .9; margin-top: 2px; }
  #connDot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #ffd54d; margin-right: 5px; }
  #connDot.on { background: #b9f6ca; }

  /* 成员条 */
  #members { display: flex; gap: 10px; padding: 10px 12px; overflow-x: auto; background: #d7efe1; flex-shrink: 0; }
  #hostBar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: #fff8e1; font-size: 12px; color: #6d5c00; flex-shrink: 0; }
  #hostBar button { border: 1px solid #b8860b; background: #fff; color: #6d5c00; border-radius: 6px; padding: 4px 10px; font-size: 12px; }
  #hostBar button:active { background: #ffe9a8; }
  /* 保活检查条幅：通知权限/电池白名单没开时红色醒目提示 */
  #permBar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: #ffebee; font-size: 12px; color: #b71c1c; flex-shrink: 0; line-height: 1.5; }
  #permBar button { border: 1px solid #b71c1c; background: #fff; color: #b71c1c; border-radius: 6px; padding: 4px 10px; font-size: 12px; flex-shrink: 0; }
  #permBar button:active { background: #ffcdd2; }
  .member {
    flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 3px;
    background: #fff; border-radius: 12px; padding: 8px 12px; min-width: 64px;
    border: 2px solid transparent;
  }
  .member .avatar {
    width: 42px; height: 42px; border-radius: 50%; background: #1faa59; color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700;
  }
  .member .mname { font-size: 13px; color: #333; max-width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .member .calltip { font-size: 11px; color: #1faa59; }
  .member.me { border-color: #ffd54d; }

  /* 消息区 */
  #messages { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; }
  .sys { text-align: center; font-size: 12px; color: #8aa396; }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 14px; font-size: 18px; line-height: 1.45; word-break: break-word; }
  .msg .who { display: block; font-size: 12px; color: #7a9b8a; margin-bottom: 3px; }
  .msg.mine { align-self: flex-end; background: #a5e8c3; border-bottom-right-radius: 4px; }
  .msg.other { align-self: flex-start; background: #fff; border-bottom-left-radius: 4px; }

  /* 输入区 */
  #inputBar { display: flex; gap: 10px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: #d7efe1; flex-shrink: 0; }
  #msgInput {
    flex: 1; min-width: 0; height: 50px; border-radius: 25px; border: none; font-size: 19px;
    padding: 0 20px; outline: none; background: #fff;
  }
  #sendBtn {
    flex-shrink: 0; height: 50px; padding: 0 22px; border-radius: 25px; background: #1faa59;
    color: #fff; font-size: 19px; font-weight: 700;
  }
  #sendBtn:disabled { background: #9dcfb3; }
  /* 发照片按钮 + 图片消息 + 全屏看图 */
  #imgBtn {
    height: 50px; width: 50px; border-radius: 25%; background: #fff; color: #1faa59;
    font-size: 22px; flex-shrink: 0;
  }
  #imgBtn:disabled { opacity: .5; }
  .msg.imgmsg { padding: 6px; }
  .msg.imgmsg .imgwrap { display: block; max-width: 220px; }
  .msg.imgmsg img.thumb {
    display: block; max-width: 220px; max-height: 280px; border-radius: 10px; cursor: zoom-in;
    background: #eee;
  }
  .msg.imgmsg .imginfo { font-size: 11px; color: #7a9b8a; margin-top: 4px; }
  #imgViewer {
    position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 60;
    display: flex; align-items: center; justify-content: center; cursor: zoom-out;
  }
  #imgViewer[hidden] { display: none; }
  #imgViewer img { max-width: 100%; max-height: 100%; object-fit: contain; }

  /* 快捷常用语：老人不用打字，点一下直接发 */
  #quickBar { display: flex; gap: 8px; padding: 8px 12px 0; flex-wrap: wrap; flex-shrink: 0; background: #d7efe1; }
  #quickBar button { border: 1px solid #1faa59; background: #fff; color: #1faa59; border-radius: 16px; padding: 6px 12px; font-size: 15px; }
  #quickBar button:active { background: #a5e8c3; }

  /* 语音消息按钮（按住说话） */
  #vmBtn {
    height: 50px; width: 50px; border-radius: 25%; background: #fff; color: #1faa59;
    font-size: 20px; flex-shrink: 0;
  }
  #vmBtn.rec { background: #e53935; color: #fff; }
  .msg.audiomsg { padding: 6px 10px; }
  .msg.audiomsg .vplay {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    border: none; background: rgba(31,170,89,.14); color: #14663a;
    border-radius: 16px; padding: 9px 14px; font-size: 16px;
  }
  .msg.audiomsg .vplay:active { background: rgba(31,170,89,.32); }
  .msg.audiomsg .imginfo { font-size: 11px; color: #7a9b8a; margin-top: 4px; }
  /* 录音中浮层 */
  #vmRecTip {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); z-index: 70;
    background: rgba(0,0,0,.82); color: #fff; border-radius: 12px; padding: 18px 24px;
    text-align: center; font-size: 15px; display: none; min-width: 150px;
  }
  #vmRecTip.on { display: block; }
  #vmRecTime { font-size: 28px; font-weight: 700; margin-bottom: 6px; }
  #vmRecText { opacity: .85; }

  /* 未读消息角标 */
  #unreadBadge { display: none; background: #e53935; color: #fff; border-radius: 10px; padding: 1px 8px; font-size: 12px; margin-left: 6px; }
  #unreadBadge.on { display: inline-block; }

  /* 消息长按菜单（复制/撤回） */
  #msgMenu {
    position: fixed; z-index: 80; background: #fff; border-radius: 10px;
    box-shadow: 0 4px 18px rgba(0,0,0,.28); display: none; overflow: hidden; min-width: 130px;
  }
  #msgMenu.on { display: block; }
  #msgMenu button { display: block; width: 100%; border: none; background: #fff; padding: 12px 20px; font-size: 16px; }
  #msgMenu button:active { background: #eee; }
  #msgMenu button.danger { color: #e53935; }
  /* 消息不可选中/不长按弹系统菜单（自定义长按菜单） */
  .msg { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #msgInput { -webkit-user-select: text; user-select: text; }

  /* 老人大字模式：一键放大全局字号（localStorage 记忆） */
  #app.big .title { font-size: 25px; }
  #app.big .sub { font-size: 15px; }
  #app.big .msg { font-size: 23px; }
  #app.big #msgInput { font-size: 23px; height: 58px; }
  #app.big #sendBtn { height: 58px; font-size: 23px; }
  #app.big #imgBtn, #app.big #vmBtn { height: 58px; width: 58px; font-size: 26px; }
  #app.big #quickBar button { font-size: 18px; padding: 8px 14px; }
  #app.big .member .mname { font-size: 21px; }
  #app.big .member .calltip { font-size: 15px; }
  #app.big #bigFontBtn { font-size: 18px; padding: 8px 14px; }

  /* ---------- 通话界面 ---------- */
  #callPage {
    position: fixed; inset: 0; background: #14532d; color: #fff; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  }
  #callPage .bigAvatar {
    width: 110px; height: 110px; border-radius: 50%; background: #1faa59;
    display: flex; align-items: center; justify-content: center; font-size: 52px; font-weight: 700;
  }
  #callStatus { font-size: 20px; opacity: .9; }
  #callTimer { font-size: 16px; opacity: .7; }
  .callTip { font-size: 13px; color: #ffd54d; max-width: 260px; text-align: center; line-height: 1.5; }
  .audioIndicators { display: flex; gap: 14px; margin-top: 6px; }
  .ind { font-size: 14px; padding: 6px 14px; border-radius: 20px; background: rgba(255,255,255,.12); color: #cfd8dc; }
  .ind.on { background: #2e7d32; color: #fff; }
  .ind.off { background: rgba(255,255,255,.12); color: #90a4ae; }
  .callDiag { font-size: 11px; color: #90a4ae; max-width: 300px; text-align: center; line-height: 1.6; margin-top: 4px; word-break: break-all; }
  .callDiag.bad { color: #ff8a80; font-weight: 600; }
  .testBtn {
    margin-top: 10px; padding: 10px 20px; border-radius: 22px;
    background: rgba(255,255,255,.15); color: #ffd54d; font-size: 14px;
  }
  #hangupBtn {
    width: 76px; height: 76px; border-radius: 50%; background: #e53935; color: #fff;
    font-size: 17px; font-weight: 700; margin-top: 30px;
  }
  .callRow { display: flex; align-items: center; gap: 18px; margin-top: 10px; }
  .vUpgrade { margin-top: 0; background: rgba(67,160,71,.25); color: #a5d6a7; }

  /* ---------- 视频通话层 ---------- */
  #videoLayer { position: fixed; inset: 0; z-index: 20; background: #000; }
  #videoLayer[hidden] { display: none; }
  #remoteVideo { width: 100%; height: 100%; object-fit: cover; background: #000; }
  .vPlace {
    position: absolute; inset: 0; z-index: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; color: rgba(255,255,255,.55);
    font-size: 14px; background: #0a0a10;
  }
  .vPlace b { font-size: 34px; font-weight: 300; }
  .vPlace[hidden] { display: none; }
  .vLocal {
    position: absolute; top: 60px; right: 14px; width: 96px; height: 128px;
    border-radius: 14px; overflow: hidden; border: 1.5px solid rgba(255,255,255,.4);
    background: #111; box-shadow: 0 6px 20px rgba(0,0,0,.5); z-index: 2;
  }
  .vLocal canvas { width: 100%; height: 100%; object-fit: cover; display: block; }
  .vLabel {
    position: absolute; top: 64px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.55); color: #fff; font-size: 12px; padding: 6px 14px;
    border-radius: 16px; white-space: nowrap; z-index: 2;
  }
  .vControls {
    position: absolute; bottom: 36px; left: 0; right: 0; z-index: 2;
    display: flex; justify-content: center; gap: 14px;
  }
  .vBtn {
    padding: 12px 18px; border-radius: 24px; background: rgba(255,255,255,.16);
    color: #fff; font-size: 14px; backdrop-filter: blur(8px);
  }
  .vBtn.on { background: #e53935; }
  .vBtn.hang { background: #e53935; font-weight: 700; }
  .vBtn:disabled { opacity: .5; }

  /* ---------- 来电弹窗 ---------- */
  #incoming {
    position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 30;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
  }
  #incoming .who { color: #fff; font-size: 26px; font-weight: 700; }
  #incoming .tip { color: #ddd; font-size: 15px; margin-top: -14px; }
  #incoming .btns { display: flex; gap: 60px; margin-top: 20px; }
  .callBtn { width: 72px; height: 72px; border-radius: 50%; font-size: 16px; font-weight: 700; color: #fff; }
  .callBtn.answer { background: #43a047; }
  .callBtn.reject { background: #e53935; }

  [hidden] { display: none !important; }
</style>
</head>
<body>

<!-- 登录页 -->
<div id="login">
  <h1>家庭聊天</h1>
  <p>家人之间的聊天与通话 · 打开就能用</p>
  <input id="nameInput" maxlength="20" placeholder="你的昵称（如：妈妈）" autocomplete="off">
  <button id="joinBtn">开 始 使 用</button>
  <div id="verTag" style="margin-top:14px;font-size:11px;opacity:.55;">版本 v28</div>
</div>

<!-- 主界面 -->
<div id="app" hidden>
  <div id="topbar">
    <div>
      <div class="title">家庭聊天</div>
      <div class="sub"><span id="connDot"></span><span id="connText">连接中…</span></div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
      <div class="sub" id="onlineBox">在线 <span id="onlineCount">0</span> 人<span id="unreadBadge"></span></div>
      <button id="bigFontBtn" style="border:1px solid #1faa59;background:#fff;color:#1faa59;border-radius:8px;padding:5px 10px;font-size:14px;">大字</button>
    </div>
  </div>

  <div id="members"></div>
  <div id="hostBar" hidden>
    <span id="hostText"></span>
    <button id="hostBtn">开主机模式</button>
    <button id="addrBtn">换服务器地址</button>
    <div style="margin-top:6px;font-size:12px;line-height:1.5;color:#8a6d1f;background:#fff8e1;border:1px solid #f0dfa0;border-radius:8px;padding:6px 8px;">
      推荐用法：一家人连<b>同一个 WiFi</b>时，在其中一台手机上点"开主机模式"，
      其他人在"换服务器地址"里填它显示的 <b>http://192.168.x.x:8080</b>，最稳定、不断网也能聊。<br>
      如果左上角一直"连接中/断开"，说明公用隧道临时不可用，改用上面的主机模式即可。
    </div>
  </div>
  <div id="permBar" hidden>
    <span id="permText"></span>
    <button id="permBtn">去开启</button>
  </div>
  <!-- 快捷常用语：点一下直接发送，老人不用打字 -->
  <div id="quickBar">
    <button data-q="吃饭了吗？">吃饭了吗？</button>
    <button data-q="我出门了">我出门了</button>
    <button data-q="注意身体">注意身体</button>
    <button data-q="收到了">收到了</button>
    <button data-q="晚点打给你">晚点打给你</button>
  </div>
  <div id="messages"></div>

  <div id="inputBar">
    <input id="msgInput" maxlength="500" placeholder="说点什么…" autocomplete="off">
    <button id="vmBtn" title="按住 说话">🎤</button>
    <button id="imgBtn" title="发照片">📷</button>
    <button id="sendBtn" disabled>发送</button>
    <input type="file" id="imgInput" accept="image/*" hidden>
  </div>
</div>

<!-- 录音中浮层 -->
<div id="vmRecTip">
  <div id="vmRecTime">0"</div>
  <div id="vmRecText">松开发送 · 上滑取消</div>
</div>

<!-- 消息长按菜单 -->
<div id="msgMenu"></div>

<!-- 全屏看图：点消息里的缩略图弹出，点任意处关闭 -->
<div id="imgViewer" hidden><img id="imgViewerImg" alt="照片"></div>

<!-- 通话界面 -->
<div id="callPage" hidden>
  <div class="bigAvatar" id="callAvatar">妈</div>
  <div class="callStatus" id="callStatus">正在呼叫…</div>
  <div class="callTimer" id="callTimer"></div>
  <div class="callTip" id="callTip"></div>
  <div class="audioIndicators">
    <span id="micInd" class="ind off">🎤 麦克风 …</span>
    <span id="spkInd" class="ind off">🔊 对方声音 …</span>
  </div>
  <div class="callDiag" id="callDiag"></div>
  <button id="micTestBtn" class="testBtn">麦克风自检（点我，然后对着手机说话）</button>
  <div class="callRow">
    <button id="vUpgradeBtn" class="testBtn vUpgrade">📹 视频通话</button>
    <button id="hangupBtn">挂断</button>
  </div>
  <!-- 视频通话层：默认隐藏，任一方升级视频后展开 -->
  <div id="videoLayer" hidden>
    <video id="remoteVideo" playsinline autoplay></video>
    <div class="vPlace" id="vPlace">摄像头已关闭</div>
    <div class="vLocal"><canvas id="localCanvas" width="240" height="320"></canvas></div>
    <div class="vLabel" id="vLabel">对方摄像头已开启</div>
    <div class="vControls">
      <button id="vCamBtn" class="vBtn">📹 开启摄像头</button>
      <button id="vFlipBtn" class="vBtn" hidden>🔄 翻转</button>
      <button id="vMuteBtn" class="vBtn">🎤 静音</button>
      <button id="vHangBtn" class="vBtn hang">📵 挂断</button>
    </div>
  </div>
</div>

<!-- 来电弹窗 -->
<div id="incoming" hidden>
  <div class="who" id="incomingWho">爸爸</div>
  <div class="tip">邀请你语音通话</div>
  <div class="btns">
    <button class="callBtn reject" id="rejectBtn">拒绝</button>
    <button class="callBtn answer" id="answerBtn">接听</button>
  </div>
</div>

<audio id="remoteAudio" autoplay playsinline></audio>
<audio id="ringAudio" src="ring.wav" loop preload="auto" playsinline></audio>

<script>
(function () {
  'use strict';

  // ---------- 状态 ----------
  var myName = (function () { try { return localStorage.getItem('fc_name') || ''; } catch (e) { return ''; } })();
  var ws = null;
  // App 模式：网络连接由原生服务持有（系统冻结网页时照常存活），页面只是 UI 终端
  var isApp = !!(window.Android && window.Android.send);
  var users = [];
  var pc = null;            // RTCPeerConnection
  var localStream = null;
  var remoteStream = null;  // 对方的声音流
  var callPeer = null;      // 正在通话的人
  var isCaller = false;
  var callTimer = null, callSeconds = 0;
  var pendingOffer = null;  // 待处理的来电 offer
  var pendingIce = [];      // 早于 SDP 到达的 ICE 候选，暂存后补发
  var micMonitor = null, spkMonitor = null, diagTimer = null;

  // 早到的候选先缓存，等 SDP 协商完再补发（避免丢候选导致单向不通）
  function addRemoteIce(cand) {
    if (pc && pc.remoteDescription && pc.remoteDescription.type) {
      pc.addIceCandidate(new RTCIceCandidate(cand)).catch(function () {});
    } else {
      pendingIce.push(cand);
    }
  }

  function flushIce() {
    while (pendingIce.length) {
      var c = pendingIce.shift();
      if (pc) pc.addIceCandidate(new RTCIceCandidate(c)).catch(function () {});
    }
  }

  var $ = function (id) { return document.getElementById(id); };

  // ---------- 登录 ----------
  if (myName) { $('nameInput').value = myName; }
  $('joinBtn').onclick = function () {
    var n = $('nameInput').value.replace(/[\s<>"']/g, '').slice(0, 20);
    if (!n) { $('nameInput').focus(); return; }
    myName = n;
    try { localStorage.setItem('fc_name', n); } catch (e) {}
    $('login').hidden = true;
    $('app').hidden = false;
    warmupAudio(); // 借"开始使用"这个点击手势解锁音频
    connect();
  };

  // ---------- WebSocket ----------
  var connecting = false;

  function connect() {
    if (connecting) return; // 防止重复连接
    if (isApp) {
      // App 模式：告诉原生服务用这个昵称连接，页面等状态下发
      connecting = true;
      window.Android.setName(myName);
      // 关键：上报页面可见，否则原生服务 pageVisible=false，回声会被误当后台消息弹通知，
      // 文本消息发出去后不显示在聊天界面（即"发送消息失败"的根因）
      try { if (window.Android.setPageVisible) window.Android.setPageVisible(true); } catch (e) {}
      // 关键：不在这里无条件显示"已连接"——以原生真实状态为准。
      // 已连接就立即显示；没连上保持"连接中…"，等原生 __conn 消息下发，
      // 避免用户看到假的"已连接"而功能实际全废。
      try { if (window.Android.isConnected) setConn(!!window.Android.isConnected()); } catch (e) {}
      refreshSendBtn();
      connecting = false;
      return;
    }
    connecting = true;
    var proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
    ws = new WebSocket(proto + location.host + '/ws');

    ws.onopen = function () {
      connecting = false;
      setConn(true);
      ws.send(JSON.stringify({ type: 'join', name: myName }));
      refreshSendBtn();
    };
    ws.onclose = function () {
      connecting = false;
      setConn(false);
      // 不在这里置灰发送键：有文字时保持可点，点击会明确提示"没连上服务器"
      setTimeout(function () { if (!$('app').hidden) connect(); }, 2000); // 自动重连
    };
    ws.onerror = function () {
      connecting = false; // onclose 会接管重连
    };
    ws.onmessage = function (e) {
      var m; try { m = JSON.parse(e.data); } catch (err) { return; }
      handleMsg(m);
    };
  }

  // 原生服务把服务器消息推进页面（App 模式唯一入口）
  window.onNativeMessage = function (json) {
    var m; try { m = JSON.parse(json); } catch (e) { return; }
    handleMsg(m);
  };

  // 页面 JS 就绪：向原生服务要一次状态（历史 + 成员），并处理通知接听
  if (isApp) {
    setTimeout(function () {
      try { window.Android.pageReady(); } catch (e) {}
    }, 300);
  }

  // ---------- 主机模式（断网自救，仅 App 内可用） ----------
  if (isApp && window.Android.startHost) {
    $('hostBar').hidden = false;
    $('hostText').textContent = '家里没外网？点右边让本机当服务器，家人连你的 WiFi 就能聊';
    $('hostBtn').onclick = function () {
      var turningOn = !/关闭/.test(this.textContent);
      try {
        // 点击即刻给反馈，避免"点了没反应"
        $('hostText').textContent = turningOn ? '正在开启主机模式…' : '正在关闭主机模式…';
        if (turningOn) window.Android.startHost(); else window.Android.stopHost();
      } catch (e) {
        $('hostText').textContent = '操作失败：' + ((e && e.message) ? e.message : '请重试');
      }
    };
    // 换服务器地址：隧道失效/地址变更时，用户在 App 内直接自救，不用重装
    $('addrBtn').onclick = function () {
      var cur = '';
      try { cur = window.Android.getServerUrl ? window.Android.getServerUrl() : ''; } catch (e) {}
      var u = prompt('把新的服务器地址粘贴到这里（找给你 App 的人要）', cur || '');
      if (u && u.trim()) {
        try { window.Android.setServerUrl(u.trim()); } catch (e) {}
        toast2('地址已保存，正在重连…');
      }
    };
  }

  // ---------- 后台保活自检：通知权限 / 电池白名单 ----------
  // 后台收不到消息的三个常见原因：通知权限没给、电池优化没关、ROM 杀了服务。
  // 前两个 App 内能检测并引导，第三个（华为启动管理）在文案里引导用户手动开
  function refreshPermBar() {
    if (!isApp) return;
    var bar = $('permBar');
    if (!bar || $('app').hidden) return;
    var need = null;
    try {
      if (window.Android.notifyPermOk && !window.Android.notifyPermOk()) {
        need = {
          msg: '通知权限没开——App 在后台/锁屏时收不到消息和来电提醒' +
              '（华为手机还需在 手机管家→应用启动管理 里允许后台活动）',
          act: function () { window.Android.openNotifySettings(); }
        };
      } else if (window.Android.batteryOptOk && !window.Android.batteryOptOk()) {
        need = {
          msg: '电池优化没关——系统可能在后台杀掉应用，导致收不到消息',
          act: function () { window.Android.openBatterySettings(); }
        };
      }
    } catch (e) {}
    if (need) {
      $('permText').textContent = need.msg;
      $('permBtn').textContent = '去开启';
      $('permBtn').onclick = need.act;
      bar.hidden = false;
    } else {
      bar.hidden = true;
    }
  }
  if (isApp) {
    refreshPermBar();
    setInterval(function () { if (!$('app').hidden) refreshPermBar(); }, 10000);
    // 从设置页回来（窗口重新获焦）立即复查，权限刚开就消掉条幅
    window.addEventListener('focus', refreshPermBar);
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) refreshPermBar();
    });
  }

  function setConn(on) {
    $('connDot').className = on ? 'on' : '';
    $('connText').textContent = on ? '已连接' : '断开，重连中…';
  }

  // 供 App 原生通知按钮调用：接听/拒绝
  window.answerCallFromAndroid = function () {
    if (pendingOffer) $('answerBtn').click();
  };
  window.rejectCallFromAndroid = function () {
    $('rejectBtn').click();
  };

  // 页面从后台切回前台时：立即重连（不依赖 onclose，手机冻结页面时定时器不跑）
  document.addEventListener('visibilitychange', function () {
    // App 模式：如实上报页面可见性，原生服务据此决定来消息进聊天界面还是弹通知
    if (isApp && window.Android && window.Android.setPageVisible) {
      try { window.Android.setPageVisible(!document.hidden); } catch (e) {}
    }
    if (!document.hidden && !$('app').hidden && !isApp && ws && ws.readyState !== 1 && !connecting) {
      connect();
    }
    // 回到前台：未读清零、标题复位
    if (!document.hidden) clearUnread();
    // 通话中切后台再回来：解除静音（原生播放路径保持静音，由 AudioTrack 放）
    if (!document.hidden && $('remoteAudio').srcObject && !(useNativeAudio && pcmCtx && downProc)) {
      $('remoteAudio').muted = false;
    }
  });

  // 应用层心跳，保活 + 及早发现断线（App 模式由原生服务负责）
  setInterval(function () {
    if (!isApp && ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'ping' }));
  }, 20000);

  function send(obj) {
    if (isApp) {
      // App 模式：原生 send 返回是否真正写入 socket。连接未就绪时返回 false，
      // 调用方（sendChat/图片/语音/通话信令）会如实提示"没连上服务器"，
      // 不再出现"消息进了队列、界面却显示成功、对方永远收不到"的假发送。
      try { return !!window.Android.send(JSON.stringify(obj)); } catch (e) { return false; }
    }
    if (ws && ws.readyState === 1) { ws.send(JSON.stringify(obj)); return true; }
    return false;
  }

  // 大载荷分片发送：免费隧道会静默丢弃 >5KB 的 WS 帧（实测 5KB 过、10KB 丢），
  // 图片/语音的 base64 统一切成 3KB 小帧过隧道，服务端原样中转，对端按 seq 重组。
  // 首帧同步发出（拿到连接状态），其余帧带 ~18ms 节奏异步发出，避免瞬间 burst 冲爆隧道缓冲。
  // 返回 false 表示第一帧就发不出去（连接断了）
  var CHUNK_CHARS = 3000;
  var CHUNK_MAX = 2000;
  // 本地时间字符串，与服务器 nowTime() 格式一致
  function nowStr() {
    var d = new Date();
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return p(d.getHours()) + ':' + p(d.getMinutes());
  }

  // 找一条"本地乐观显示、尚未被回声确认"且文本相同的自己消息（用于回声去重）
  function findLocalMine(text) {
    var nodes = document.querySelectorAll('.msg.mine[data-mid^="local-"]');
    for (var i = nodes.length - 1; i >= 0; i--) {
      var body = nodes[i].lastElementChild;
      if (body && body.textContent === text) return nodes[i];
    }
    return null;
  }

  // 统一发送文本：发送 + 本地乐观显示（图片/语音同理）。返回是否成功交给信道。
  function sendChat(text) {
    text = (text || '').trim();
    if (!text) return false;
    if (!send({ type: 'chat', text: text })) {
      addSys('没连上服务器，这条没发出去——等左上角显示"已连接"再发');
      return false;
    }
    // 本地立即显示自己这条，等服务器回声回来再升级为真实 id（去重）。
    // 这样即使回声稍有延迟或断线重连，自己发出的消息也"立刻看得见"，
    // 不会再被误判成"发送消息失败"。
    addMsg(myName, text, nowStr(), 'local-' + Date.now());
    scrollBottom();
    return true;
  }

  function sendBig(mtype, b64, extra) {
    var total = Math.ceil(b64.length / CHUNK_CHARS);
    if (total > CHUNK_MAX) total = CHUNK_MAX;
    var mid = 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    function emit(i) {
      var m = {
        type: 'chunk', mid: mid, seq: i, total: total, mtype: mtype,
        data: b64.substr(i * CHUNK_CHARS, CHUNK_CHARS)
      };
      if (i === 0 && extra) { for (var k in extra) m[k] = extra[k]; }
      return send(m);
    }
    if (!emit(0)) return false;
    for (var i = 1; i < total; i++) {
      (function (idx) { setTimeout(function () { emit(idx); }, idx * 18); })(i);
    }
    return true;
  }

  // ---------- 媒体经 HTTP 传输（绕开隧道丢 WS 大帧） ----------
  // 大文件（图片/语音）先 HTTP POST 上传拿 id，WS 只广播短消息引用，对端再 HTTP 取回。
  // 隧道对 HTTP 友好（之前 GET 一直 200），对连续 WS 大帧会静默丢（实测 5KB 过 10KB 丢），
  // 故图片/语音一律走 HTTP，不再依赖 WS 分片。
  function uploadMedia(u8, type) {
    var ctrl = ('AbortController' in window) ? new AbortController() : null;
    var to = ctrl ? setTimeout(function () { ctrl.abort(); }, 12000) : null;
    return fetch(location.origin + '/upload', {
      method: 'POST', headers: { 'Content-Type': type || 'application/octet-stream' }, body: u8,
      signal: ctrl ? ctrl.signal : undefined,
    }).then(function (r) { if (to) clearTimeout(to); if (!r.ok) throw new Error('upload ' + r.status); return r.json(); })
      .then(function (j) { if (!j.id) throw new Error('no id'); return j.id; });
  }
  function fetchMedia(id) {
    return fetch(location.origin + '/media/' + encodeURIComponent(id)).then(function (r) {
      if (!r.ok) throw new Error('media ' + r.status); return r.arrayBuffer();
    });
  }
  function b64ToU8(b64) {
    var bin = atob(b64), u8 = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    return u8;
  }
  function u8ToB64(u8) {
    var s = '', chunk = 0x8000;
    for (var i = 0; i < u8.length; i += chunk) s += String.fromCharCode.apply(null, u8.subarray(i, i + chunk));
    return btoa(s);
  }

  // 分片重组缓冲：mid -> { total, parts, dur }（收不齐的会被后续新 mid 挤掉，防泄漏）
  var chunkBuf = {};
  function handleChunk(m) {
    var b = chunkBuf[m.mid];
    if (!b) {
      if (Object.keys(chunkBuf).length > 50) delete chunkBuf[Object.keys(chunkBuf)[0]];
      b = chunkBuf[m.mid] = { total: m.total, parts: {}, dur: m.dur };
    }
    if (m.dur != null) b.dur = m.dur;
    b.parts[m.seq] = m.data;
    for (var i = 0; i < b.total; i++) if (b.parts[i] == null) return; // 还没齐
    var out = '';
    for (var j = 0; j < b.total; j++) out += b.parts[j];
    delete chunkBuf[m.mid];
    var full = { type: m.mtype, from: m.from, time: m.time, dur: b.dur };
    if (m.mtype === 'chat-img') full.img = out;
    else if (m.mtype === 'chat-audio') full.audio = out;
    else return;
    if (m.from === myName) return; // 自己发的经 server 回环回来，已本地乐观显示，不再重复
    handleMsg(full);
  }

  // ---------- 消息处理 ----------
  function handleMsg(m) {
    switch (m.type) {
      case '__conn':
        // 原生服务的连接状态同步（App 模式）
        setConn(!!m.on);
        break;
      case '__host':
        // 主机模式状态（App 内）
        if (m.on) {
          $('hostText').textContent = '主机模式已开启：http://' + m.ip + ':' + m.port +
              ' —— 让家人连家里 WiFi，在 App 里填这个地址';
          $('hostBtn').textContent = '关闭主机模式';
        } else {
          $('hostText').textContent = m.err ? ('主机模式开启失败：' + m.err + '，请重试') : '主机模式已关闭';
          $('hostBtn').textContent = '开主机模式';
        }
        break;
      case 'joined':
        myName = m.name;
        break;
      case 'history': {
        // 进页面时下发最近记录，刷新不丢上下文
        (m.list || []).forEach(function (h) {
          if (h.type === 'chat') addMsg(h.from, h.text, h.time, h.id);
        });
        break;
      }
      case 'chat':
        if (m.from === myName) {
          // 自己发的：本地已乐观显示，回声回来只需把临时 id 升级为真实 id，避免重复气泡
          var local = findLocalMine(m.text);
          if (local) { local.setAttribute('data-mid', m.id); break; }
        }
        addMsg(m.from, m.text, m.time, m.id);
        if (m.from !== myName) bumpUnread();
        // 纯浏览器模式且页面在后台：自己弹原生通知（App 模式由原生服务负责）
        if (!isApp && window.Android && window.Android.showMessageNotification && document.hidden) {
          window.Android.showMessageNotification(m.from, m.text);
        }
        break;
      case 'chat-img': {
        var mine = (m.from === myName);
        if (!mine) bumpUnread();
        // 纯浏览器模式且页面在后台：图片通知（App 模式由原生服务负责）
        if (!isApp && !mine && window.Android && window.Android.showMessageNotification && document.hidden) {
          window.Android.showMessageNotification(m.from, '[图片]');
        }
        if (mine) break; // 自己发的已本地乐观显示，回环消息跳过，避免重复
        if (m.img) {
          addImgMsg(m.from, m.img, m.time); // 旧客户端整条
        } else if (m.id) {
          fetchMedia(m.id).then(function (ab) {
            var url = URL.createObjectURL(new Blob([ab], { type: m.mime || 'image/jpeg' }));
            addImgMsg(m.from, url, m.time);
          }).catch(function () { addSys(m.from + ' 发来的图片加载失败'); });
        }
        break;
      }
      case 'chat-audio': {
        var mine = (m.from === myName);
        if (!mine) bumpUnread();
        // 纯浏览器模式且页面在后台：语音通知（App 模式由原生服务负责）
        if (!isApp && !mine && window.Android && window.Android.showMessageNotification && document.hidden) {
          window.Android.showMessageNotification(m.from, '[语音]');
        }
        if (mine) break; // 自己发的已本地乐观显示，回环消息跳过，避免重复
        if (m.audio) {
          addAudioMsg(m.from, m.audio, m.dur, m.time); // 旧客户端整条
        } else if (m.id) {
          fetchMedia(m.id).then(function (ab) {
            addAudioMsg(m.from, u8ToB64(new Uint8Array(ab)), m.dur, m.time);
          }).catch(function () { addSys(m.from + ' 发来的语音加载失败'); });
        }
        break;
      }
      case 'chat-recall': {
        // 有人撤回了一条消息：本地有就抹掉，并提示一声
        var rn = document.querySelector('.msg[data-mid="' + m.id + '"]');
        if (rn) { rn.parentNode.removeChild(rn); addSys('一条消息被撤回了'); }
        break;
      }
      case 'system':
        addSys(m.text);
        break;
      case 'users':
        users = m.list || [];
        renderMembers();
        break;
      case 'call-fail':
        if (m.reason === 'offline') {
          addSys(m.to + ' 现在不在线，等对方上线再打');
          endCallUI();
        }
        break;
      case 'call-offer':
        onIncomingCall(m);
        break;
      case 'call-answer':
        onCallAnswered(m);
        break;
      case 'call-reject':
        onCallRejected(m);
        break;
      case 'call-end':
        onRemoteHangup();
        break;
      case 'video-toggle':
        if (callPeer === m.from) onRemoteVideoToggle(m.on);
        break;
      case 'ice':
        onRemoteIce(m);
        break;
      case 'chunk':
        // 大载荷分片（图片/语音）：攒齐同一 mid 后重组，走正常消息渲染
        handleChunk(m);
        break;
    }
  }

  // ---------- 聊天 UI ----------
  function addMsg(from, text, time, id) {
    var div = document.createElement('div');
    div.className = 'msg ' + (from === myName ? 'mine' : 'other');
    if (id) div.setAttribute('data-mid', id);
    var who = document.createElement('span');
    who.className = 'who';
    who.textContent = (from === myName ? '我' : from) + ' · ' + (time || '');
    var body = document.createElement('span');
    body.textContent = text;
    div.appendChild(who); div.appendChild(body);
    $('messages').appendChild(div);
    bindMsgLongPress(div, id, from, text);
    scrollBottom();
  }

  // 图片消息气泡：缩略图 + 点击全屏看原图
  function addImgMsg(from, dataUrl, time, sizeKb) {
    var div = document.createElement('div');
    div.className = 'msg imgmsg ' + (from === myName ? 'mine' : 'other');
    var who = document.createElement('span');
    who.className = 'who';
    who.textContent = (from === myName ? '我' : from) + ' · ' + (time || '');
    div.appendChild(who);
    var wrap = document.createElement('span');
    wrap.className = 'imgwrap';
    var img = document.createElement('img');
    img.className = 'thumb';
    img.src = dataUrl;
    img.alt = '照片';
    img.onclick = function () { showImgViewer(dataUrl); };
    wrap.appendChild(img);
    var info = document.createElement('div');
    info.className = 'imginfo';
    info.textContent = sizeKb ? ('照片 · ' + sizeKb + ' KB · 点开放大') : '照片 · 点开放大';
    wrap.appendChild(info);
    div.appendChild(wrap);
    $('messages').appendChild(div);
    scrollBottom();
  }

  // 全屏看图
  function showImgViewer(dataUrl) {
    $('imgViewerImg').src = dataUrl;
    $('imgViewer').hidden = false;
  }
  $('imgViewer').onclick = function () {
    $('imgViewer').hidden = true;
    $('imgViewerImg').src = '';
  };

  function addSys(text) {
    var div = document.createElement('div');
    div.className = 'sys';
    div.textContent = '—— ' + text + ' ——';
    $('messages').appendChild(div);
    scrollBottom();
  }

  function scrollBottom() {
    var box = $('messages');
    // 长期聊天地 DOM 会越来越重：超过 200 条就砍最旧的（视觉无感，防卡顿）
    while (box.children.length > 200) box.removeChild(box.firstChild);
    box.scrollTop = box.scrollHeight;
  }

  // ---------- 消息长按菜单：复制 / 撤回自己的 ----------
  var msgMenuEl = null;
  function bindMsgLongPress(div, id, from, text) {
    var timer = null;
    var start = function () {
      timer = setTimeout(function () { openMsgMenu(div, id, from, text); }, 500);
    };
    var cancel = function () { clearTimeout(timer); };
    div.addEventListener('touchstart', start, { passive: true });
    div.addEventListener('touchend', cancel);
    div.addEventListener('touchmove', cancel);
    div.addEventListener('touchcancel', cancel);
    // 桌面浏览器/部分机型：右键或系统长按菜单统一接管
    div.addEventListener('contextmenu', function (e) {
      e.preventDefault();
      openMsgMenu(div, id, from, text);
    });
  }

  function openMsgMenu(node, id, from, text) {
    msgMenuEl = { id: id, from: from, text: text };
    var menu = $('msgMenu');
    menu.innerHTML = '';
    if (text) {
      var b1 = document.createElement('button');
      b1.textContent = '复制文字';
      b1.onclick = function () { copyText(text); closeMsgMenu(); };
      menu.appendChild(b1);
    }
    if (from === myName && id) {
      var b2 = document.createElement('button');
      b2.className = 'danger';
      b2.textContent = '撤回这条';
      b2.onclick = function () {
        if (!send({ type: 'chat-recall', id: id })) addSys('没连上服务器，撤回失败');
        closeMsgMenu();
      };
      menu.appendChild(b2);
    }
    if (!menu.children.length) return;
    var r = node.getBoundingClientRect();
    var mh = menu.children.length * 45 + 8;
    var top = r.bottom + 4;
    if (top + mh > window.innerHeight) top = Math.max(8, r.top - mh - 4); // 贴近底部时往上翻
    menu.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 150)) + 'px';
    menu.style.top = top + 'px';
    menu.classList.add('on');
  }

  function closeMsgMenu() {
    $('msgMenu').classList.remove('on');
    msgMenuEl = null;
  }
  document.addEventListener('click', function (e) {
    if (!$('msgMenu').contains(e.target)) closeMsgMenu();
  });

  function copyText(t) {
    var ta = document.createElement('textarea');
    ta.value = t;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, t.length);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { }
    document.body.removeChild(ta);
    if (!ok && navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).catch(function () { });
      ok = true;
    }
    toast2(ok ? '已复制' : '复制失败，请长按气泡手动复制');
  }

  // ---------- 未读消息提醒 ----------
  var unread = 0;
  function bumpUnread() {
    unread++;
    var b = $('unreadBadge');
    b.textContent = unread + '条新消息';

      for (var i2 = 0; i2 < need; i2++) {

      return pc.setLocalDescription(offer);
    }).then(function () {
      send({ type: 'call-offer', to: callPeer, sdp: pc.localDescription });
    }).catch(function (err) {
      var msg = (err && err.name === 'NotAllowedError')
        ? '麦克风权限被拒——去浏览器设置里允许这个网页用麦克风'
        : '通话发起失败：' + (err && err.message ? err.message : err);
      addSys(msg);
      endCallUI();
    });
  }

  function onIncomingCall(m) {
    if (!$('callPage').hidden) { // 忙线
      // 正在通话中且对方发起视频升级（带新 SDP 的 call-offer）→ 走重协商，不当新来电
      if (m.video && m.sdp && m.from === callPeer && pc) {
        pc.setRemoteDescription(new RTCSessionDescription(m.sdp)).then(function () {
          flushIce();
          return pc.createAnswer();
        }).then(function (answer) {
          return pc.setLocalDescription(answer);
        }).then(function () {
          send({ type: 'call-answer', to: callPeer, sdp: pc.localDescription });
          showVideoLayer();
          $('vLabel').textContent = '对方邀请你视频通话';
        }).catch(function () {});
        return;
      }
      send({ type: 'call-reject', to: m.from });
      return;
    }
    pendingOffer = m;
    $('incomingWho').textContent = m.from;
    $('incoming').hidden = false;
    startRing();
    if (!(window.Android && window.Android.showCallNotification) && navigator.vibrate) {
      try { navigator.vibrate([400, 200, 400, 200, 400]); } catch (e) {}
    }
    // 从通知栏"接听"按钮进来：自动接听
    if (m.__auto) {
      setTimeout(function () { if (pendingOffer) $('answerBtn').click(); }, 600);
    }
  }

  $('answerBtn').onclick = function () {
    stopRing();
    if (window.Android && window.Android.cancelCallNotification) {
      window.Android.cancelCallNotification();
    }
    var m = pendingOffer; pendingOffer = null;
    $('incoming').hidden = true;
    if (!m) return;
    callPeer = m.from; isCaller = false;
    showCallPage(m.from, '接通中…');

    function attach(stream) {
      localStream = stream;
      if (!useNativeAudio) monitorMic(stream); // 原生链路的指示灯由 onNativeMicPcm 驱动
      pc = newPeer();
      stream.getTracks().forEach(function (t) { pc.addTrack(t, stream); });
      return pc.setRemoteDescription(new RTCSessionDescription(m.sdp));
    }

    var micPromise;
    if (useNativeAudio) {
      // 原生采集：App 直接录音，绕过鸿蒙 WebView 限制
      var nativeStream = buildNativeMicStream();
      window.NativeAudio.startMic();
      micRestarts = 0; micRestartAt = 0; micPcmAt = Date.now(); micPcmFrames = 0; pcmProcAt = Date.now(); pcmProcFires = 0;
      micPromise = Promise.resolve(nativeStream);
    } else {
      if (!navigator.mediaDevices || !window.RTCPeerConnection) {
        alert('当前浏览器不支持通话，请用微信视频代替'); return;
      }
      micPromise = navigator.mediaDevices.getUserMedia({ audio: AUDIO_CONSTRAINT });
    }
    micPromise.then(attach).then(function () {
      flushIce();
      return pc.createAnswer();
    }).then(function (answer) {
      return pc.setLocalDescription(answer);
    }).then(function () {
      send({ type: 'call-answer', to: callPeer, sdp: pc.localDescription });
    }).catch(function (err) {
      addSys('接听失败：' + (err && err.message ? err.message : err));
      endCallUI();
    });
  };

  $('rejectBtn').onclick = function () {
    stopRing();
    if (window.Android && window.Android.cancelCallNotification) {
      window.Android.cancelCallNotification();
    }
    var m = pendingOffer; pendingOffer = null;
    $('incoming').hidden = true;
    if (m) send({ type: 'call-reject', to: m.from });
  };

  function onCallAnswered(m) {
    if (pc && isCaller) {
      pc.setRemoteDescription(new RTCSessionDescription(m.sdp)).then(function () {
        flushIce();
      }).catch(function () {});
      $('callStatus').textContent = '通话中';
    } else if (pc && callPeer === m.from && m.sdp) {
      // 重协商场景（对方升级视频后的 answer）：非呼叫方也要应用远端描述
      pc.setRemoteDescription(new RTCSessionDescription(m.sdp)).then(function () {
        flushIce();
      }).catch(function () {});
    }
  }

  function onCallRejected(m) {
    addSys(m.from + ' 没有接听');
    endCallUI();
  }

  function onRemoteHangup() {
    addSys('通话结束');
    endCallUI();
  }

  function onRemoteIce(m) {
    addRemoteIce(m.candidate);
  }

  // ---------- 通话 UI ----------
  function showCallPage(peer, status) {
    $('callAvatar').textContent = peer.charAt(0);
    $('callStatus').textContent = status;
    $('callTimer').textContent = '';
    $('callPage').hidden = false;
    $('callTip').textContent = '通话中请不要离开这个页面，否则会没声音';
  }

  function startTimer() {
    if (callTimer) return;
    $('callStatus').textContent = '通话中';
    callSeconds = 0;
    callTimer = setInterval(function () {
      callSeconds++;
      var mm = String(Math.floor(callSeconds / 60)).padStart(2, '0');
      var ss = String(callSeconds % 60).padStart(2, '0');
      $('callTimer').textContent = mm + ':' + ss;
    }, 1000);
    // 诊断信息每 2 秒刷新（App 内显示原生音频链路状态，出问题一眼定位）
    if (diagTimer) clearInterval(diagTimer);
    diagTimer = setInterval(function () {
      var d = $('callDiag');
      if (!d) return;
      if (!(useNativeAudio && window.NativeAudio && window.NativeAudio.getDiag)) { d.textContent = ''; return; }
      var now = Date.now();
      // ===== 链路自检：哪一端断了立刻红字告警，能自动恢复的自动恢复 =====
      var alert = '';
      // ① 上行：原生麦克风数据 4 秒没到网页 → 自动重启录音（最多 2 次，冷却 5 秒）。
      //    注意：重启只节流"动作"，告警要持续显示——否则重试中的几秒又露出
      //    正常诊断行，用户以为没事，其实对方一直听不到
      if (micPcmAt && now - micPcmAt > 4000) {
        if (micRestarts < 2 && now - micRestartAt > 5000) {
          micRestarts++;
          micRestartAt = now;
          try { window.NativeAudio.stopMic(); } catch (e) {}
          setTimeout(function () {
            if (!$('callPage').hidden) { try { window.NativeAudio.startMic(); } catch (e) {} }
          }, 300);
          alert = '麦克风没数据了，正在自动重试（' + micRestarts + '/2）';
        } else if (micRestarts >= 2) {
          alert = '麦克风还是没数据——请挂断重打一次，不行就重启 App';
        } else {
          alert = '麦克风没数据，等待自动重试…';
        }
      }
      // ② 上行：网页音频处理（ScriptProcessor）5 秒没被调度 → WebRTC 只能发静音
      if (!alert && pcmProcAt && now - pcmProcAt > 5000) {
        alert = '网页音频处理' + (pcmProcFires ? '停了' : '从未运行') + '，声音发不出去——请挂断重打';
      }
      // 被系统冻结的 AudioContext 拉起来（页面切后台再回来时常发生）
      if (pcmCtx && pcmCtx.state !== 'running') { try { pcmCtx.resume(); } catch (e) {} }
      // ③ 摄像头：开了 5 秒一帧都没画上 → 黑屏（权限被拒/被占用/机型限制）
      if (window.NativeCamera && videoOn && camOpenAt && now - camOpenAt > 5000 && camFrames === 0) {
        alert += (alert ? '；' : '') + '摄像头画面没到：查权限、是否被别的应用占用' +
            (camFrameErr > 0 ? '（解码失败 ' + camFrameErr + ' 帧）' : '');
      }
      if (alert) { d.textContent = '⚠ ' + alert; d.className = 'callDiag bad'; return; }
      d.className = 'callDiag';
      var s2 = 'v28 | ' + window.NativeAudio.getDiag();
      if (nativeRate && nativeRate !== pcmRate) s2 += " 重采样" + nativeRate + "→" + pcmRate;
      if (window.NativeCamera && window.NativeCamera.cameraDiag) s2 += " | " + window.NativeCamera.cameraDiag();
      d.textContent = s2;
    }, 2000);
  }

  function endCallUI() {
    stopRing();
    stopNativeDownlink();
    // 视频收尾：停摄像头、清轨道、隐藏视频层
    videoOn = false; remoteVideoOn = false;
    camFrames = 0; camFrameErr = 0; camOpenAt = 0; camReady = false;
    micPcmAt = 0; pcmProcAt = 0; micRestarts = 0; micRestartAt = 0;
    if (window.NativeCamera) { try { window.NativeCamera.stopCamera(); } catch (e) {} }
    try { if (vTrack) vTrack.stop(); } catch (e) {}
    vTrack = null; vSender = null;
    try { var rv = $('remoteVideo'); if (rv) rv.srcObject = null; } catch (e) {}
    $('videoLayer').hidden = true;
    $('vCamBtn').textContent = '📹 开启摄像头';
    $('vCamBtn').disabled = false;
    $('vCamBtn').classList.remove('on');
    $('vFlipBtn').hidden = true;
    $('vMuteBtn').textContent = '🎤 静音';
    $('vMuteBtn').classList.remove('on');
    if (diagTimer) { clearInterval(diagTimer); diagTimer = null; }
    $('callDiag').textContent = '';
    if (useNativeAudio && window.NativeAudio) {
      try { window.NativeAudio.stopMic(); } catch (e) {}
      try { window.NativeAudio.stopPlay(); } catch (e) {}
      try { window.NativeAudio.setDownActive(false); } catch (e) {}
      // 关掉本次通话的 AudioContext：不关的话 pcmProc 仍被调度、Context 越攒越多
      try { if (pcmCtx && pcmCtx.close) { pcmCtx.close(); } } catch (e) {}
      pcmCtx = null; pcmProc = null; pcmDest = null;
    }
    micMuted = false;
    if (micMonitor) { clearInterval(micMonitor); micMonitor = null; }
    if (spkMonitor) { clearInterval(spkMonitor); spkMonitor = null; }
    $('micInd').className = 'ind off'; $('micInd').textContent = '🎤 麦克风 …';
    $('spkInd').className = 'ind off'; $('spkInd').textContent = '🔊 对方声音 …';
    if (callPeer) send({ type: 'call-end', to: callPeer });
    if (callTimer) { clearInterval(callTimer); callTimer = null; }
    if (pc) { try { pc.close(); } catch (e) {} pc = null; }
    if (localStream) { localStream.getTracks().forEach(function (t) { t.stop(); }); localStream = null; }
    callPeer = null; isCaller = false;
    $('callPage').hidden = true;
  }

  $('hangupBtn').onclick = endCallUI;

  // ---------- 麦克风自检：本地回环，不走网络 ----------
  $('micTestBtn').onclick = function () {
    if (!localStream) { $('callStatus').textContent = '还没接通，自检失败'; return; }
    var btn = this;
    btn.disabled = true;
    btn.textContent = '自检中…对着手机说几句话';
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var src = ctx.createMediaStreamSource(localStream);
      var g = ctx.createGain();
      g.gain.value = 0.9;
      src.connect(g);
      g.connect(ctx.destination); // 麦克风 → 喇叭，直接回放
      setTimeout(function () {
        try { src.disconnect(); g.disconnect(); ctx.close(); } catch (e) {}
        btn.disabled = false;
        btn.textContent = '麦克风自检（点我，然后对着手机说话）';
        $('callStatus').textContent = '自检结束';
      }, 5000);
      $('callStatus').textContent = '自检中：对着手机说话，听喇叭里有没有你自己的声音';
    } catch (e) {
      btn.disabled = false;
      btn.textContent = '麦克风自检（点我，然后对着手机说话）';
      $('callStatus').textContent = '自检失败：' + e.message;
    }
  };

  // 页面隐藏时静音处理（省电）
  document.addEventListener('visibilitychange', function () {
    var a = $('remoteAudio');
    if (!a.srcObject) return;
    if (document.hidden) {
      a.muted = true;
    } else if (!(useNativeAudio && pcmCtx && downProc)) {
      // 原生播放路径下保持静音（声音由 AudioTrack 放），否则双重播放
      a.muted = false;
    }
  });

  // 调试/自检钩子：把内部通话状态暴露到 window（只读，无副作用，便于自动化测试排查）
  setInterval(function () {
    try {
      window.__pc = pc; window.__vOn = videoOn; window.__vRemote = remoteVideoOn;
      window.__camReady = camReady;
      window.__camFrames = camFrames;      // 真实画上 canvas 的帧数（黑屏自检）
      window.__micFrames = micPcmFrames;   // 原生麦克风到达网页的帧数（上行自检）
      window.__micMuted = micMuted;        // 硬静音状态
      window.__micStalled = !!(micPcmAt && Date.now() - micPcmAt > 4000);
    } catch (e) {}
  }, 400);
})();
</script>
</body>
</html>
